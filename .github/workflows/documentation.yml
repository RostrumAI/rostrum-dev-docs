name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        run: npx --yes markdownlint-cli@0.46.0 "**/*.md" --disable MD013
      - name: Check relative links
        run: node scripts/check-links.mjs
